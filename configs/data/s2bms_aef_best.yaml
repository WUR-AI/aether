_target_: src.data.base_datamodule.BaseDataModule

dataset:
  _target_: src.data.butterfly_dataset.ButterflyDataset
  csv_name: model_ready_s2bms-unlabelled-merged_incl-test-aux.csv

  seed: ${seed}
  dtype: float32
  cache_dir: ${paths.cache_dir}
  data_dir: ${paths.data_dir}

  modalities:
    aef_avr:
      path: ${paths.data_dir}/s2bms/eo/avr_aef_256_unlabelled.csv
      enable_nans: true

  use_target_data: false
  use_unlabelled_data: true
  use_aux_data:
    aux:
      pattern: ".*aux_(?!.*top).*"
      standardise: true
    top:
      pattern: "^aux_.*top.*"

caption_builder:
  _target_: src.data.butterfly_caption_builder.ButterflyCaptionBuilder
  templates_fname: v6.json
  concepts_fname: v8.json
  data_dir: ${paths.data_dir}/s2bms
  seed: ${seed}
  n_captions_for_validation: 1

batch_size: 16
num_workers: 8
pin_memory: true
split_mode: "from_file"
save_split: false
saved_split_file_name: "s2bms_unlabelled_union_val_test.pth"
seed: ${seed}
