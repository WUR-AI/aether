# @package _global_
# Guatemala performance: R2=0.733, RMSE=1.011, MAE=0.814
# Kraków performance: R2=0.924, RMSE=0.568, MAE=0.441
defaults:
  - override /model: heat_krakow_tessera_avg
  - override /data: heat_krakow
  - override /metrics: krakow_regression
tags: ["heat_island", "krakow", "tessera_avg", "best", "regression"]
seed: 12345
trainer:
  min_epochs: 1
  max_epochs: 100
data:
  batch_size: 64
  dataset:
    modalities:
      coords: {}
      tessera:
        year: 2024
        size: 10
        format: npy
callbacks:
  model_checkpoint:
    monitor: val_r2
    mode: max
  early_stopping:
    monitor: val_r2
    mode: max
    patience: 20
logger:
  wandb:
    tags: ${tags}
    group: "heat_island"
  aim:
    experiment: "heat_island"
