# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# AEF with average encoder and MLP prediction head, for tile sizes 128 and 256, each with 3 random seeds

defaults:
  - override /model: s2bms_prediction
  - override /data: satbird-usa
  - override /metrics: satbird_predictive

tags:
  - prediction
  - aef
  - aef_${str:${data.dataset.modalities.aef_avr.size}}
  - ${str:${seed}}

experiment_name: avr_aef_${str:${data.dataset.modalities.aef_avr.size}}_mlp

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.identity_encoder.IdentityEncoder
    geo_data_name: aef_avr
  trainable_modules: [prediction_head]
  prediction_head:
    _target_: src.models.components.pred_heads.mlp_pred_head.MLPPredictionHead

data:
  dataset:
    modalities:
      aef_avr:
        path: ${paths.data_dir}/satbird-USA-summer/eo/aef-satbird-usa-summer_average-${data.dataset.modalities.aef_avr.size}.csv
        enable_nans: true
    use_target_data: true
    use_aux_data: false
  caption_builder:
  pin_memory: true
  num_workers: 14
  batch_size: 128
  persistent_workers: true
  saved_split_file_name: "satbird-USA-summer_aef_union_val_test.pth"

logger:
  wandb:
    tags: ${tags}
    group: "predictive"
    project: "satbird-usa-summer_prediction"
  aim:
    experiment: "predictive"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 12345, 404, 654
      ++data.dataset.modalities.aef_avr.size: 128, 256
