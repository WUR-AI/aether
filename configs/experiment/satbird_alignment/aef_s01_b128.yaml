# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# CLIP

defaults:
  - override /model: satbird_alignment
  - override /data: satbird-usa
  - override /metrics: satbird_alignment

tags:
  - alignment
  - avr_aef_256
  - ${str:${seed}}

experiment_name: s0.5_b128
projects: satbird_alignment

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.identity_encoder.IdentityEncoder
    geo_data_name: aef_avr
  geo_adapter:
    _target_: src.models.components.projectors.mlp_projector.MLPProjector
    nn_layers: 3
    hidden_dim: 512
    output_dim: 768
  text_encoder:
    _target_: src.models.components.text_encoders.clip_text_encoder.ClipTextEncoder
    hf_cache_dir: ${paths.huggingface_cache}
    use_geoclip_projector: false
  loss_fn:
    _target_: src.models.components.loss_fns.soft_contrastive_loss.SoftContrastiveLoss
    temperature: 0.07
    sigma: 0.5
  trainable_modules: [loss_fn.log_temp]
  optimizer:
    lr: 0.001

data:
  dataset:
    csv_name: model_ready_satbird-USA-summer_with_lc_scaled.csv
    modalities:
      aef_avr:
        path: ${paths.data_dir}/satbird-USA-summer/eo/aef-satbird-usa-summer_average-256.csv
        enable_nans: true
    use_target_data: false
    use_aux_data:
      aux:
        pattern: ".*aux_(?!.*top).*"
        standardise: true
      top:
        pattern: "^aux_.*top.*"
    dtype: float32
  caption_builder:
    _target_: src.data.satbird_caption_builder.SatBirdCaptionBuilder
    templates_fname: v0.json
    concepts_fname: v4.json
    data_dir: ${paths.data_dir}/satbird-USA-summer
    seed: ${seed}
    n_captions_for_validation: 1
    return_aux_ids: true
  num_workers: 14
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 6
  saved_split_file_name: "satbird-USA-summer_aef_union_val_test_lc.pth"
  batch_size: 512

logger:
  wandb:
    tags: ${tags}
    group: "alignment"
    project: "satbird-usa-summer_alignment"

callbacks:
  model_checkpoint:
    monitor: "val_avr_top-dyn_k_index"
    mode: "max"
  early_stopping:
    monitor: "val_avr_top-dyn_k_index"
    patience: 10
    mode: "max"
    min_delta: 0.001

trainer:
  num_sanity_val_steps: -1

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      ++data.batch_size: 128
      #      seed: 654
      seed: 12345, 404, 654
