# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# SkyCLIP Baseline

defaults:
  - override /model: satbird_alignment
  - override /data: satbird-usa
  - override /metrics: satbird_alignment

baseline: true
ckpt_path:
validate: true
seed: 12345

tags:
  - baseline
  - alignment
  - skyclip

experiment_name: baseline_SkyCLIP_${str:${model.model_name}}_${str:${data.dataset.modalities.s2.preprocessing}}

projects: satbird_alignment

model:
  _target_: src.models.skyclip_baseline.build_SkyCLIP_model
  hf_cache_dir: ${paths.huggingface_cache}
  trainable_modules: []
  preprocessing: ${data.dataset.modalities.s2.preprocessing}

data:
  dataset:
    csv_name: model_ready_satbird-USA-summer_with_lc_scaled.csv
    modalities:
      s2:
        size: 224
        channels: rgb
        format: tif
    use_target_data: false
    use_aux_data:
      aux:
        pattern: ".*aux_(?!.*top).*"
        standardise: true
      top:
        pattern: "^aux_.*top.*"
    dtype: float32
  caption_builder:
    _target_: src.data.satbird_caption_builder.SatBirdCaptionBuilder
    templates_fname: v0.json
    concepts_fname: v4.json
    data_dir: ${paths.data_dir}/satbird-USA-summer
    seed: ${seed}
    n_captions_for_validation: 1
    return_aux_ids: true
  num_workers: 14
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 6
  saved_split_file_name: "satbird-USA-summer_aef_union_val_test_lc.pth"
  batch_size: 128

logger:
  wandb:
    tags: ${tags}
    group: "alignment"
    project: "satbird-usa-summer_alignment"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      ++model.model_name: SkyCLIP_ViT_L14_top30pct_filtered_by_CLIP_laion_RS, SkyCLIP_ViT_L14_top50pct, SkyCLIP_ViT_L14_top30pct, SkyCLIP_ViT_L14_top30pct_multi_objects, SkyCLIP_ViT_B32_top50pct
      ++data.dataset.modalities.s2.preprocessing: div_2000, div_10000, stretch_2_98
