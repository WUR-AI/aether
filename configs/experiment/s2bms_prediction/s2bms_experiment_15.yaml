# @package _global_

# to execute this experiment run:
# python train.py experiment=example

#  Better toegther: AEF with average encoder and satclip, and MLP prediction head, for tile sizes 128, each with 3 random seeds

defaults:
  - override /model: s2bms_prediction
  - override /data: s2bms_prediction
  - override /metrics: s2bms_predictive

tags:
  - prediction
  - aef_satclip
  - aef_128
  - ${str:${seed}}

experiment_name: avr_aef_128_and_satclip_mlp

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.encoder_wrapper.EncoderWrapper

    encoder_branches:
      - encoder:
          _target_: src.models.components.geo_encoders.identity_encoder.IdentityEncoder
          geo_data_name: aef_avr
      - encoder:
          _target_: src.models.components.geo_encoders.satclip.SatClipCoordinateEncoder
          geo_data_name: coords
          hf_cache_dir: ${paths.huggingface_cache}
    #            return_dtype: float32
    normalise: false
    fusion_strategy: "concat"

  trainable_modules: [prediction_head]
  prediction_head:
    _target_: src.models.components.pred_heads.mlp_pred_head.MLPPredictionHead
    hidden_dim: 512

data:
  dataset:
    modalities:
      coords:
      aef_avr:
        path: ${paths.data_dir}/s2bms/eo/avr_aef_128.csv
        enable_nans: true
    use_target_data: true
    use_aux_data: false

  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  num_workers: 7
  batch_size: 128
  saved_split_file_name: "s2bms_unlabelled_union_val_test.pth"

logger:
  wandb:
    tags: ${tags}
    group: "predictive"
    project: "s2bms_prediction"
  aim:
    experiment: "predictive"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 12345, 404, 654
