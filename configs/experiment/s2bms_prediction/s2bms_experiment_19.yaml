# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# Center point aef prediction

defaults:
  - override /model: s2bms_prediction
  - override /data: s2bms_prediction
  - override /metrics: s2bms_predictive

tags:
  - prediction
  - tessera
  - tessera_point
  - ${str:${seed}}

experiment_name: tessera_point_prediction

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.identity_encoder.IdentityEncoder
    geo_data_name: tessera_avr
  trainable_modules: [prediction_head]
  prediction_head:
    _target_: src.models.components.pred_heads.mlp_pred_head.MLPPredictionHead

data:
  dataset:
    modalities:
      tessera_avr:
        path: ${paths.data_dir}/s2bms/eo/avr_tessera_1.csv
        size: 1
    use_target_data: true
    use_aux_data: false
  caption_builder:
  pin_memory: true
  num_workers: 14
  batch_size: 128
  persistent_workers: true
  saved_split_file_name: "s2bms_union_val_test.pth"

logger:
  wandb:
    tags: ${tags}
    group: "predictive"
    project: "s2bms_prediction"
  aim:
    experiment: "predictive"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 12345, 404, 654
#      seed: 12345
