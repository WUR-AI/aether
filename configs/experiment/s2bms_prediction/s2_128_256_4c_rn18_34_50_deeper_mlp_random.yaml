# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# S2 4c tiles (128 and 256 size) with Imagenet Resnet and MLP prediction head, with 3 random. RN also trainable

defaults:
  - override /model: s2bms_prediction
  - override /data: s2bms_prediction
  - override /metrics: s2bms_predictive

tags:
  - prediction
  - s2
  - s2_${str:${data.dataset.modalities.s2.size}}
  - ${str:${seed}}

experiment_name: s2_${str:${data.dataset.modalities.s2.size}}_4c_rn${str:${model.geo_encoder.resnet_version}}_deeper_mlp

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.cnn_encoder.CNNEncoder
    geo_data_name: s2
    input_n_bands: 4
    pretrained_cnn:
  prediction_head:
    _target_: src.models.components.pred_heads.mlp_pred_head.MLPPredictionHead
    nn_layers: 3
  trainable_modules: [geo_encoder, prediction_head]

data:
  dataset:
    modalities:
      s2:
        format: tif
        dtype: float32
        channels: 4c
        preprocessing: zscored
    use_target_data: true
    use_aux_data: false
    dtype: float32
  caption_builder:
  pin_memory: true
  num_workers: 14
  batch_size: 128
  persistent_workers: true
  prefetch_factor: 4
  saved_split_file_name: "s2bms_union_val_test.pth"

logger:
  wandb:
    tags: ${tags}
    group: "predictive"
    project: "s2bms_prediction"
  aim:
    experiment: "predictive"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 12345, 404, 654
      ++data.dataset.modalities.s2.size: 128, 256
      ++model.geo_encoder.resnet_version: 18, 34, 50
