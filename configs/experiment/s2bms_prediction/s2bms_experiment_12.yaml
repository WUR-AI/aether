# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# Tessera with resnet (18 or 50) encoder and MLP prediction head, for tile sizes 128 and 256, each with 3 random seeds

defaults:
  - override /model: s2bms_prediction
  - override /data: s2bms_prediction
  - override /metrics: s2bms_predictive

tags:
  - prediction
  - tessera
  - tessera_${str:${data.dataset.modalities.tessera.size}}
  - ${str:${seed}}

experiment_name: rn${str:${model.geo_encoder.resnet_version}}_tessera_${str:${data.dataset.modalities.tessera.size}}_mlp_v1.1

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.cnn_encoder.CNNEncoder
    geo_data_name: tessera
    input_n_bands: 128
    pretrained_cnn:
  prediction_head:
    _target_: src.models.components.pred_heads.mlp_pred_head.MLPPredictionHead
  trainable_modules: [geo_encoder, prediction_head]

data:
  dataset:
    modalities:
      tessera:
        format: npy
    use_target_data: true
    use_aux_data: false
    dtype: float32
  caption_builder:
  pin_memory: true
  num_workers: 14
  batch_size: 128
  persistent_workers: true
  saved_split_file_name: "s2bms_union_val_test.pth"

logger:
  wandb:
    tags: ${tags}
    group: "predictive"
    project: "s2bms_prediction"
  aim:
    experiment: "predictive"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 12345, 404, 654
      ++data.dataset.modalities.tessera.size: 128, 256
      ++model.geo_encoder.resnet_version: 18, 50
