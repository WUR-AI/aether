# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# DOFACLIP Baseline

defaults:
  - override /model: s2bms_alignment
  - override /data: s2bms_prediction
  - override /metrics: s2bms_alignment

baseline: true
ckpt_path:
validate: true
seed: 12345

tags:
  - baseline
  - alignment
  - dofa_clip

model:
  _target_: src.models.dofa_clip_baseline.build_DOFACLIP_model
  hf_cache_dir: ${paths.huggingface_cache}
  trainable_modules: []
  preprocessing: ${data.dataset.modalities.s2.preprocessing}
  geo_data_name: s2_${data.dataset.modalities.s2.channels}

experiment_name: DOFACLIP_${str:${model.model_name}}_baseline_${data.dataset.modalities.s2.channels}_stretched
projects: s2bms_alignment

data:
  dataset:
    csv_name: model_ready_s2bms-unlabelled-merged_incl-test-aux.csv
    modalities:
      s2:
        size: 224
        format: tif
        preprocessing: stretch_2_98
    use_target_data: false
    use_aux_data:
      aux:
        pattern: ".*aux_(?!.*top).*"
        standardise: true
      top:
        pattern: "^aux_.*top.*"
    use_unlabelled_data: false
    dtype: float32
  caption_builder:
    _target_: src.data.butterfly_caption_builder.ButterflyCaptionBuilder
    templates_fname: v6.json
    concepts_fname: v8.json
    data_dir: ${paths.data_dir}/s2bms
    seed: ${seed}
    n_captions_for_validation: 50
  num_workers: 1
  persistent_workers: true
  saved_split_file_name: "s2bms_union_val_test.pth"
  batch_size: 128

logger:
  wandb:
    tags: ${tags}
    group: "alignment"
    project: "s2bms_alignment"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      ++model.model_name: ViT-B-16, ViT-L-14
      ++data.dataset.modalities.s2.channels: 4c, rgb
