# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# CLIP Baseline

defaults:
  - override /model: s2bms_alignment
  - override /data: s2bms_prediction
  - override /metrics: s2bms_alignment

baseline: true
ckpt_path:
validate: true
seed: 12345

tags:
  - baseline
  - alignment
  - clip

experiment_name: baseline_clip_${str:${size}}_${str:${data.dataset.modalities.s2.preprocessing}}_v11
projects: s2bms_vlm_baselines

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.clip_img.ClipImgEncoder
    geo_data_name: s2
    hf_cache_dir: ${paths.huggingface_cache}
    model_name: ${size}

  text_encoder:
    _target_: src.models.components.text_encoders.clip_text_encoder.ClipTextEncoder
    use_geoclip_projector: false
    hf_cache_dir: ${paths.huggingface_cache}
    model_name: ${size}
  loss_fn:
  trainable_modules: []

data:
  dataset:
    csv_name: model_ready_s2bms_incl-test-aux.csv
    modalities:
      s2:
        size: 224
        channels: rgb
        format: tif
    use_target_data: false
    use_aux_data:
      aux:
        pattern: ".*aux_(?!.*top).*"
        standardise: true
      top:
        pattern: "^aux_.*top.*"
    use_unlabelled_data: false
    dtype: float32
  caption_builder:
    _target_: src.data.butterfly_caption_builder.ButterflyCaptionBuilder
    templates_fname: v6.json
    concepts_fname: v11.json
    data_dir: ${paths.data_dir}/s2bms
    seed: ${seed}
    n_captions_for_validation: 1
  num_workers: 1
  persistent_workers: true
  saved_split_file_name: "s2bms_union_val_test.pth"
  batch_size: 128

logger:
  wandb:
    tags: ${tags}
    group: "alignment"
    project: "s2bms_alignment"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      ++size: ViT-B-32, ViT-B-16, ViT-L-14, RN50
      ++data.dataset.modalities.s2.preprocessing: div_2000, div_10000, stretch_2_98
