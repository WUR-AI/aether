# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# Geoclip with linear prediction head, with 3 random seeds

defaults:
  - override /model: s2bms_alignment
  - override /data: s2bms_prediction
  - override /metrics: s2bms_alignment

baseline: true
ckpt_path:
validate: true
seed: 12345

tags:
  - baseline
  - alignment
  - remoteclip

experiment_name: SkyCLIP_${str:${model.model_name}}_baseline
projects: s2bms_alignment

model:
  _target_: src.models.skyclip_baseline.build_SkyCLIP_model
  hf_cache_dir: ${paths.huggingface_cache}
  trainable_modules: []
  preprocessing: ${data.dataset.modalities.s2.preprocessing}

data:
  dataset:
    modalities:
      s2:
        size: 224
        channels: rgb
        format: tif
        preprocessing: div_2000
    use_target_data: false
    use_aux_data: "all"
    use_unlabelled_data: false
    dtype: float32
  caption_builder:
    _target_: src.data.butterfly_caption_builder.ButterflyCaptionBuilder
    templates_fname: v6.json
    concepts_fname: v4.json
    data_dir: ${paths.data_dir}/s2bms
    seed: ${seed}
    n_captions_for_validation: 50
  num_workers: 1
  persistent_workers: true
  saved_split_file_name: "s2bms_union_val_test.pth"
  batch_size: 128

logger:
  wandb:
    tags: ${tags}
    group: "alignment"
    project: "s2bms_aef_alignment_baselines"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      #      ++model.model_name: SkyCLIP_ViT_L14_top30pct_filtered_by_CLIP_laion_RS, SkyCLIP_ViT_L14_top50pct, SkyCLIP_ViT_L14_top30pct, SkyCLIP_ViT_L14_top30pct_multi_objects, SkyCLIP_ViT_B32_top50pct
      ++model.model_name: SkyCLIP_ViT_B32_top50pct
