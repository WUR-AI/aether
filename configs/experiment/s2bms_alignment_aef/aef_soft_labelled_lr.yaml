# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# Labelled data

defaults:
  - override /model: s2bms_alignment
  - override /data: s2bms_prediction
  - override /metrics: s2bms_alignment

tags:
  - alignment
  - avr_aef_256
  - ${str:${seed}}

experiment_name: aef_soft_s${str:${model.loss_fn.sigma}}_b${str:${data.batch_size}}_v10_labelled_higher_lr
projects: s2bms_alignment

model:
  geo_encoder:
    _target_: src.models.components.geo_encoders.identity_encoder.IdentityEncoder
    geo_data_name: aef_avr
  geo_adapter:
    _target_: src.models.components.projectors.mlp_projector.MLPProjector
    nn_layers: 3
    hidden_dim: 512
    output_dim: 768
  text_encoder:
    _target_: src.models.components.text_encoders.clip_text_encoder.ClipTextEncoder
    hf_cache_dir: ${paths.huggingface_cache}
    use_geoclip_projector: false
  loss_fn:
    _target_: src.models.components.loss_fns.soft_contrastive_loss.SoftContrastiveLoss
    temperature: 0.07
  trainable_modules: [loss_fn.log_temp]
  optimizer:
    lr: 0.001

data:
  dataset:
    csv_name: model_ready_s2bms_incl-test-aux.csv
    modalities:
      aef_avr:
        path: ${paths.data_dir}/s2bms/eo/avr_aef_256.csv
        enable_nans: true
    use_target_data: false
    use_aux_data:
      aux:
        pattern: ".*aux_(?!.*top).*"
        standardise: true
      top:
        pattern: "^aux_.*top.*"
    use_unlabelled_data: false
    dtype: float32
  caption_builder:
    _target_: src.data.butterfly_caption_builder.ButterflyCaptionBuilder
    templates_fname: v6.json
    concepts_fname: v10.json
    data_dir: ${paths.data_dir}/s2bms
    seed: ${seed}
    n_captions_for_validation: 1

  num_workers: 14
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 6
  saved_split_file_name: "s2bms_union_val_test.pth"

logger:
  wandb:
    tags: ${tags}
    group: "alignment"
    project: "s2bms_alignment"
  aim:
    experiment: "alignment"

callbacks:
  model_checkpoint:
    monitor: "val_avr_top-dyn_k_index"
    mode: "max"
  early_stopping:
    monitor: "val_avr_top-dyn_k_index"
    patience: 30
    mode: "max"
    min_delta: 0.001

trainer:
  num_sanity_val_steps: -1

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 12345, 404, 654
      #      seed: 654
      ++model.loss_fn.sigma: 0.1, 0.2, 0.5, 1, 1.5, 2
      #      ++model.loss_fn.sigma:  0.1, 0.2, 1, 1.5, 2
      ++data.caption_builder.return_aux_ids: true
      # ++data.batch_size: 64, 128 # 256 #, 512, 1028
      ++data.batch_size: 512
